<script>
// 页面加载时检查是否已经登录
window.addEventListener('load', function () {
  var currentUser = localStorage.getItem("currentUser");
  if (currentUser != null) {
    document.getElementById("loginArea").innerHTML =
      "<p style='text-align:center;font-size:16px;color:#2b2b2b;'>您已登录为：" + currentUser + "</p>" +
      "<p style='text-align:center;margin-top:14px;'><a class='btn' href='../index.htm'>返回首页</a></p>" +
      "<p style='text-align:center;margin-top:10px;'><a href='javascript:logout()'>退出登录</a></p>";
  }
});
// 登录函数：点击"登录"按钮时执行
function login() {
  var username = document.getElementById("username").value;
  var password = document.getElementById("password").value;
  var users = localStorage.getItem("users");
  if (users == null) {
    alert("还没有注册账号，请先注册");
    return false;
  }
  var userList = JSON.parse(users);
  for (var i = 0; i < userList.length; i++) {
    if (userList[i].username == username && userList[i].password == password) {
      localStorage.setItem("currentUser", username);
      alert("登录成功，欢迎 " + username + "！");
      location.href = "../index.htm";
      return false;
    }
  }
  alert("用户名或密码错误，请重新输入");
  return false;
}
// 退出登录：清除登录状态并刷新页面
function logout() {
  localStorage.removeItem("currentUser");
  location.href = "../index.htm";
}
</script>
